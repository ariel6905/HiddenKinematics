# PartManip cabinet environment (src/envs/franka_pose_cabinet_base.py).
# `common` is shared; `teacher` (state-based PPO) and `student` (visual policy: demo collection,
# DAgger+PPO and evaluation) are merged on top of it.

common:
  episode_length: 200
  env_spacing: 3.0
  env_per_asset: 1
  robot_urdf: franka_description/robots/franka_panda_slider_new.urdf   # relative to the asset root
  robot_scale: 2
  open_proportion: {door: 0.53, drawer: 0.2}   # success: joint position (rad / m) within 0.01 of this value or beyond (door 0.53 rad = 30 deg)

teacher:
  point_cloud: null                            # state observations only (no cameras)
  reward: {rot: 0.2, reach: 2.0, open: 1.0, decouple: {door: 2.0, drawer: 2.0}, sparse_bonus: 0, sparse_threshold: 0.7}

student:
  point_cloud:                                 # three 256x256 depth cameras, fused and cropped
    max_depth: 5
    x_min: -1.5
    x_max: -0.3
    y_min: -1.5
    y_max: 1.5
    z_min: 0.5
    z_max: 3.0
    num_presample: 8000                        # random subsample before farthest point sampling
    num_points: 4000
  # only used by DAgger+PPO: no dense opening reward, a one-off bonus when the joint passes sparse_threshold
  reward: {rot: 0.2, reach: 2.0, open: 0.0, decouple: {door: 2.0, drawer: 1.0}, sparse_bonus: 100.0, sparse_threshold: 0.7}
